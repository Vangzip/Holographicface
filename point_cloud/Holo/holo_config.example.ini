# Holo full-pipeline config.
# Paths are resolved relative to this config file.

point_cloud_exe=..\point_cloud\target\point_cloud.exe
multiview_exe=..\multiview\target\testmulitview.exe

depth_input_dir=..\point_cloud\face_roate
depth_config=..\point_cloud\face_roate\depth_to_pointcloud_config.cfg
mesh_config=..\point_cloud\face_roate\mesh_config.cfg

# Leave empty to auto-pick the first OBJ under depth_input_dir after the model stage.
mesh_obj=..\point_cloud\face_roate\0_mesh_model.obj

multiview_out_dir=..\multiview\output_270x270_res150
elemental_out_dir=output_150x150_res270

model_type=obj

# multiview: 30 * 9 = 270 view rows/cols, each view image is 150x150.
multiview_angle=30
multiview_per=9
multiview_resolution=150
view_rows=270
view_cols=270
view_name_digits=3

# elemental output: 150 * 150 files, each file is 270x270 pixels.
target_rows=150
target_cols=150
jpg_quality=100
elemental_block_images=750

run_depth_pointcloud=true
run_mesh=true
run_textured_model=true
run_multiview=true
run_elemental=true

# Current multiview.exe still needs a right click to start capture.
# Set false only after multiview gets an autostart/headless option.
multiview_interactive_start=true
