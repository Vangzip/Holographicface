# Depth map to point cloud settings.

# Disparity baseline.
disp=1

# Disparity step.
step=0.02

# Maximum label value in the depth image.
label=150

# Focal length.
focus=105

# Disparity pixel offset.
fdis=0.5

# Optional green-background filter threshold.
# greenRGB=10

# Optional point-cloud outlier filters.
# meanK=50
# stddevMulThresh=1.0
# radiussearch=0.05
# minNeighborInRadius=5
outlier_filter_enabled=false
greenRGB=10
meanK=50
stddevMulThresh=1
radiussearch=0.05
minNeighborInRadius=5
