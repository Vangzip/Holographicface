# Point cloud to mesh settings.

# 1 = Poisson reconstruction, 2 = greedy projection triangulation.
reconstruct=2

# Neighbor search count.
kSearch=20

# Search radius.
searchradius=0.01

# Nearest-neighbor distance multiplier.
mu=2.5

# Maximum nearest-neighbor count.
maximumNearestNeighbors=100

# Maximum surface angle, degrees.
maximumSurfaceAngle=45

# Minimum triangle angle, degrees.
minimumAngle=10

# Maximum triangle angle, degrees.
maximumAngle=120

# Hole size.
holesize=0.005

# Focal length used for texturing.
focus=2000

# Voxel filter leaf size. 0 disables filtering.
leafsize=0.001

# MLS search radius.
mlsSearchRadius=0.01

# Normal fitting iteration counts.
normalsFitIter1=1
normalsFitIter2=1

# Nearest-neighbor settings used for normals.
neighbor_num=20
nearest_distance=0.01
