# MergeHolo default pipeline config.
# Paths are resolved relative to this file.

depth_input_dir=..\runs\latest\pipeline_input
depth_config=depth_to_pointcloud_config.cfg
mesh_config=mesh_config.cfg

# Leave empty to auto-pick the first OBJ under depth_input_dir after the model stage.
mesh_obj=

output_root=../runs/latest/output
multiview_out_dir=multiview
elemental_out_dir=elemental
log_file=..\runs\latest\output\pipeline.log

model_type=obj

multiview_camera_distance_scale=2
multiview_camera_center_offset_x=0
multiview_camera_center_offset_y=0
multiview_camera_center_offset_z=0
multiview_camera_eye_dir_x=0.0
multiview_camera_eye_dir_y=0.0
multiview_camera_eye_dir_z=1.0
multiview_camera_up_x=0.0
multiview_camera_up_y=1.0
multiview_camera_up_z=0.0
multiview_camera_fovy_deg=0.0
multiview_camera_z_near=0.0
multiview_camera_z_far=0.0
multiview_capture_flip_vertical=true

multiview_angle=90
multiview_per=3
multiview_resolution=150
# 0 auto-selects a GPU-supported atlas size, capped for memory stability.
multiview_atlas_size=0
view_name_digits=3

target_rows=150
target_cols=150
jpg_quality=100

elemental_writer_threads=0
elemental_flip_source_y=false
elemental_flip_view_rows=false

run_depth_pointcloud=true
run_mesh=true
run_textured_model=true
run_multiview=true
run_elemental=true
input_mode=rgb_depth
input_dir=../runs/latest/output/input
multiview_initial_rotate_x_deg=0
multiview_initial_rotate_z_deg=0
save_mesh_result=false
save_multiview_result=false
save_elemental_result=false
