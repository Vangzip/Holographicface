# Micro functional test config.
# Uses only face_roate/0.tiff + face_roate/0.jpg and writes under output/micro.

depth_input_dir=face_roate
depth_config=depth_to_pointcloud_config.cfg
mesh_config=mesh_config.cfg

mesh_obj=face_roate\0_mesh_model.obj

multiview_out_dir=output\micro\multiview
elemental_out_dir=output\micro\elemental

model_type=obj

# 3 * 1 = 3 rows/cols of views, so only 9 multiview images.
multiview_angle=3
multiview_per=1
multiview_resolution=3
view_rows=3
view_cols=3
view_name_digits=3

# Generate only 3 * 3 elemental images; each output image is 3x3 pixels.
target_rows=3
target_cols=3
jpg_quality=100
elemental_block_images=9

run_depth_pointcloud=true
run_mesh=true
run_textured_model=true
run_multiview=true
run_elemental=true
