# Holo full-pipeline config.
# Paths are resolved relative to this config file.

depth_input_dir=..\samples\face_roate
depth_config=depth_to_pointcloud_config.cfg
mesh_config=mesh_config.cfg

# Leave empty to auto-pick the first OBJ under depth_input_dir after the model stage.
mesh_obj=..\samples\face_roate\0_mesh_model.obj

output_root=..\runs\full_150x150_res270
multiview_out_dir=multiview
elemental_out_dir=elemental

model_type=obj

# Multiview camera controls.
# distance_scale: camera distance = model bounding-sphere radius * this value.
multiview_camera_distance_scale=2.0
# center_offset_*: look-at target offset in model/world units after the model is centered.
# Positive Z looks higher, making the model appear lower in the rendered image.
multiview_camera_center_offset_x=0.0
multiview_camera_center_offset_y=0.0
multiview_camera_center_offset_z=0.0
# eye_dir_*: direction from the look-at target to the camera before normalization.
# Default (0,-1,0) means the camera looks along the world +Y direction toward the model.
multiview_camera_eye_dir_x=0.0
multiview_camera_eye_dir_y=-1.0
multiview_camera_eye_dir_z=0.0
# up_*: world direction that should appear upward in the rendered image.
multiview_camera_up_x=0.0
multiview_camera_up_y=0.0
multiview_camera_up_z=1.0
# fovy_deg: vertical field of view in degrees. 0 keeps the OSG default projection.
multiview_camera_fovy_deg=0.0
# z_near/z_far: camera clipping planes in model/world units. 0 keeps OSG defaults.
multiview_camera_z_near=0.0
multiview_camera_z_far=0.0
# initial_rotate_*_deg: optional initial model pose before scanning views.
# Empty/commented values keep the legacy defaults: X=multiview_angle/2, Z=-multiview_angle/2.
# multiview_initial_rotate_x_deg=45.0
# multiview_initial_rotate_z_deg=-45.0
# capture_flip_vertical: converts OpenGL bottom-left pixels to image top-left coordinates.
multiview_capture_flip_vertical=true

# multiview: 90 * 3 = 270 view rows/cols, each view image is 150x150.
multiview_angle=90
multiview_per=3
multiview_resolution=150
view_name_digits=3

# elemental output: 150 * 150 files; each file size is derived from multiview_angle * multiview_per.
target_rows=150
target_cols=150
jpg_quality=100

# Use 1 writer thread; multi-threaded JPEG writing is disabled for stability.
elemental_writer_threads=1
# flip_source_y: read multiview image rows from bottom to top for elemental physical Y.
elemental_flip_source_y=true
# flip_view_rows: write the vertical view axis bottom-to-top in each elemental image.
elemental_flip_view_rows=true

run_depth_pointcloud=true
run_mesh=true
run_textured_model=true
run_multiview=true
run_elemental=true
