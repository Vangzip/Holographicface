# Small multiview profiling config. It renders 10x10 views to keep the timing loop quick.
depth_input_dir=face_roate_test
depth_config=depth_to_pointcloud_config.cfg
mesh_config=mesh_config.cfg
mesh_obj=face_roate_test\0_mesh_model.obj
output_root=output\multiview_profile
multiview_out_dir=multiview
elemental_out_dir=elemental

model_type=obj
multiview_angle=10
multiview_per=1
multiview_resolution=150
view_name_digits=3

target_rows=150
target_cols=150
jpg_quality=100
elemental_writer_threads=0
elemental_flip_source_y=true
elemental_flip_view_rows=true

run_depth_pointcloud=false
run_mesh=false
run_textured_model=false
run_multiview=true
run_elemental=false
