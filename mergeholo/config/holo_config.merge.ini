# MergeHolo capture-to-pipeline config.
# Paths are resolved relative to this config file in mergeholo/config.

depth_input_dir=..\runs\latest\pipeline_input
depth_config=depth_to_pointcloud_config.cfg
mesh_config=mesh_config.cfg

# Leave empty to auto-pick the first OBJ under depth_input_dir after the model stage.
mesh_obj=

output_root=..\runs\latest\output
multiview_out_dir=multiview
elemental_out_dir=elemental

model_type=obj

multiview_camera_distance_scale=2.0
multiview_camera_center_offset_x=0.0
multiview_camera_center_offset_y=0.0
multiview_camera_center_offset_z=0.0
multiview_camera_eye_dir_x=0.0
multiview_camera_eye_dir_y=-1.0
multiview_camera_eye_dir_z=0.0
multiview_camera_up_x=0.0
multiview_camera_up_y=0.0
multiview_camera_up_z=1.0
multiview_camera_fovy_deg=0.0
multiview_camera_z_near=0.0
multiview_camera_z_far=0.0
multiview_capture_flip_vertical=true

multiview_angle=90
multiview_per=3
multiview_resolution=150
view_name_digits=3

target_rows=150
target_cols=150
jpg_quality=100

# 0 lets the pipeline choose hardware threads for the in-memory elemental transform.
elemental_writer_threads=0
elemental_flip_source_y=true
elemental_flip_view_rows=true

run_depth_pointcloud=true
run_mesh=true
run_textured_model=true
run_multiview=true
run_elemental=true
