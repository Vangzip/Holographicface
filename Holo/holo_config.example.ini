# Holo full-pipeline config.
# Paths are resolved relative to this config file.

depth_input_dir=face_roate
depth_config=depth_to_pointcloud_config.cfg
mesh_config=mesh_config.cfg

# Leave empty to auto-pick the first OBJ under depth_input_dir after the model stage.
mesh_obj=face_roate\0_mesh_model.obj

output_root=output\full_150x150_res270
multiview_out_dir=multiview
elemental_out_dir=elemental

model_type=obj

# multiview: 30 * 9 = 270 view rows/cols, each view image is 150x150.
multiview_angle=30
multiview_per=9
multiview_resolution=150
view_name_digits=3

# elemental output: 150 * 150 files; each file size is derived from multiview_angle * multiview_per.
target_rows=150
target_cols=150
jpg_quality=100

# 0 = auto, capped at 8 writer threads.
elemental_writer_threads=0

run_depth_pointcloud=true
run_mesh=true
run_textured_model=true
run_multiview=true
run_elemental=true
