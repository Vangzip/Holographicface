# 点云转网格配置文件

# 重建算法类型：1=泊松重建, 2=贪婪投影三角化
reconstruct=1

# K近邻搜索数量
kSearch=20

# 搜索半径
searchradius=0.01

# 最近邻距离乘子
mu=2.5

# 最大最近邻数量
maximumNearestNeighbors=100

# 最大表面角度（度）
maximumSurfaceAngle=45

# 最小角度（度）
minimumAngle=10

# 最大角度（度）
maximumAngle=120

# 补洞大小
holesize=0.005

# 焦距参数（用于贴图）
focus=105

# 体素滤波大小（0表示不滤波，建议值：0.001-0.01）
leafsize=0.003

# MLS搜索半径
mlsSearchRadius=0.01

# 法线拟合迭代次数
normalsFitIter1=1
normalsFitIter2=1

# 最近邻数量（用于法线计算）
neighbor_num=20

# 最近邻距离
nearest_distance=0.01



