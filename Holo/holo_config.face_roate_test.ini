# Temporary diagnostic config for multi-input heap/ownership investigation.
# It runs depth -> mesh -> model on face_roate_test and skips slow render stages.
depth_input_dir=face_roate_test
depth_config=depth_to_pointcloud_config.cfg
mesh_config=mesh_config.cfg

mesh_obj=face_roate_test\0_mesh_model.obj
output_root=output\face_roate_test_debug
multiview_out_dir=multiview
elemental_out_dir=elemental

model_type=obj

multiview_angle=90
multiview_per=3
multiview_resolution=150
view_name_digits=3

target_rows=150
target_cols=150
jpg_quality=100
elemental_writer_threads=0
elemental_flip_source_y=true
elemental_flip_view_rows=true

run_depth_pointcloud=true
run_mesh=true
run_textured_model=true
run_multiview=false
run_elemental=false
